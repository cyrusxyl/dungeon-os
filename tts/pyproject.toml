[project]
name = "dungeon-tts"
version = "0.1.0"
description = "Narration TTS service for DungeonOS"
requires-python = ">=3.12,<3.13"
dependencies = ["starlette>=0.37", "uvicorn>=0.30", "numpy>=1.26"]

[tool.uv]
package = false

[project.optional-dependencies]
gpu = ["torch==2.8.0", "torchaudio==2.8.0", "f5-tts>=1.1.22", "soundfile", "jiwer"]

[tool.uv.sources]
torch = { index = "pytorch-cu128", extra = "gpu" }
torchaudio = { index = "pytorch-cu128", extra = "gpu" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
